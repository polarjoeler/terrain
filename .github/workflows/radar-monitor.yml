name: Radar monitor

# Two cloud sweeps (free) that need no Mac: the clone monitor (pure computation
# over fingerprints already in Postgres) and the domain & email intel sweep
# (pure DNS — typosquat lookalikes + SPF/DMARC posture). Fingerprinting + AI
# enrichment stay on the Mac cron for now.
#
# Required repo secret: DATABASE_URL (Settings -> Secrets and variables ->
# Actions -> New repository secret) — same Supabase pooler URL as .env.local.
# Optional: RESEND_API_KEY + EMAIL_FROM to also send clone alert emails from the
# cloud run (without them the monitor just skips the alert pass). No
# ANTHROPIC_API_KEY needed — neither sweep makes LLM calls.

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: radar-monitor
  cancel-in-progress: false # never overlap runs

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run monitor sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/radar-monitor.mjs
      - name: Run domain & email intel sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/radar-domain-watch.mjs
